[project]
name = "point-tracking-filter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
    "pyopengl>=3.1",
    "scipy-stubs~=1.18.1",
]

[project.scripts]
point-tracking-filter = "point_tracking_filter.__main__:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/point_tracking_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
